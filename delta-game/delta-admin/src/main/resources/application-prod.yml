pay:
  kf:
    token-secret: "CHANGE_ME_TO_RANDOM_32+"
    token-ttl-seconds: 900
    h5-pay-base-url: "https://guokegames.online/h5/#/pages/order/h5pay"

# File upload（生产环境，Linux 服务器）
file:
  upload:
    path: /www/data/upload
    url-prefix: https://guokegames.online/file/

# Settlement
delta:
  settlement:
    commission-rate: 0.2

# Logging
logging:
  level:
    com.delta: debug
    org.springframework.security: info

# Knife4j Swagger
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.delta
  paths-to-match: "/**"

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类