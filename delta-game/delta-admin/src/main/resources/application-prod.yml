server:
  port: 8080

spring:
  application:
    name: delta-game
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/delta_game?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: delta_game
    password: GNN8MMWy4ynaWSWH
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AES encryption
aes:
  key: delta-game-aes-128bit!

# JWT
jwt:
  secret: delta-game-jwt-secret-key-2024-must-be-at-least-256-bits-long-for-hs256
  expiration: 259200000

# WeChat Mini Program
wx:
  miniapp:
    # 小程序appid
    appid: wx57e6dbce98e9810f
    # 小程序secret
    secret: 30b44841a835fb8e1a1d33ab98231271
    # 是否开启微信小程序登录（新增加）
    enabled: true
    subscribe-template:
