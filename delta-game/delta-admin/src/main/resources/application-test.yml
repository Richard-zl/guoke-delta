# 测试环境（test.guokegames.online），启动参数：--spring.profiles.active=test
server:
  port: 8081

spring:
  application:
    name: delta-game-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/delta_game_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: delta_game_test
    password: GNN8MMWy4ynaWSWH
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

aes:
  key: delta-game-test-aes-128bit!

# 与正式环境使用不同 secret，避免 token 互通
jwt:
  secret: delta-game-jwt-test-env-2026-must-be-at-least-256-bits-long
  expiration: 259200000

auth:
  h5:
    login-code: 123456

wx:
  miniapp:
    # 测小程序登录时改为 true，并填写与正式相同的 appid/secret
    enabled: false
    appid: wx94531abaf63a4df6
    secret: b8fad52f2be75944e3e04559aa757e61
    subscribe-template:
      order-status: sUrc4cGcXvz5Mi59q3b0Jp8jmNt9CGWd2_-pc0jiwGs
      income: YOUR_TEMPLATE_ID_INCOME
      team-invite: YOUR_TEMPLATE_ID_TEAM_INVITE
      order-confirm: YOUR_TEMPLATE_ID_ORDER_CONFIRM
  pay:
    # 测试环境默认关闭，避免真实扣款；要测支付再开并改 notify-url
    enabled: false
    mch-id: 1107259302
