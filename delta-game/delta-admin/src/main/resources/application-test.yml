    private-key-path: /www/certs/apiclient_key.pem
    cert-serial-no: 2570746C0A751AE36DAF57299D8EB0D012700A86
    public-key-path: /www/certs/pub_key.pem
    public-key-id: PUB_KEY_ID_0111072593022026030900112061000400
  mp:
    appid: ""
    secret: ""
  kf:
    corp-id: ""
    secret: ""
    callback-token: ""
    callback-aes-key: ""

pay:
  kf:
    token-secret: "CHANGE_ME_TO_RANDOM_32+"
    token-ttl-seconds: 900
    h5-pay-base-url: "https://test.guokegames.online/h5/#/pages/order/h5pay"

file:
  upload:
    path: /www/data/upload-test
    url-prefix: https://test.guokegames.online/file/

delta:
  settlement:
    commission-rate: 0.2

logging:
  level:
    com.delta: debug
    org.springframework.security: info

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.delta
  paths-to-match: "/**"

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类
